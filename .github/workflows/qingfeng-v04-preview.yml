name: Qingfeng v0.4 preview validation

on:
  push:
    branches:
      - test/qingfeng-v04-preview

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb

      - name: Install Godot 4.7.2
        run: |
          curl -L --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Headless project check
        run: |
          ./godot --headless --path . --editor --quit

      - name: Runtime validation and screenshot
        run: |
          xvfb-run -a ./godot --path . --script res://tests/qingfeng_preview_test.gd

      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qingfeng-v04-runtime
          path: qingfeng_v04_runtime.png
          if-no-files-found: warn
